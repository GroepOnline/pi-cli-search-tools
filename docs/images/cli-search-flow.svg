<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Pi CLI Search Tools workflow</title><desc id="desc">A coding question is converted into a deterministic non-interactive command pipeline and concise unique-file output.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1118"/><stop offset="1" stop-color="#131c27"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".25"/></filter></defs><rect width="1600" height="760" fill="url(#bg)"/><text x="90" y="92" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="40" font-weight="700">Search like a good terminal operator.</text><text x="90" y="136" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="22">Turn a broad coding question into a reproducible, non-interactive pipeline.</text>
<g filter="url(#s)" font-family="ui-monospace,monospace"><rect x="90" y="220" width="400" height="300" rx="24" fill="#101821" stroke="#334155"/><text x="125" y="265" fill="#93c5fd" font-size="17">QUESTION</text><text x="125" y="315" fill="#f8fafc" font-size="22">Find every place this</text><text x="125" y="348" fill="#f8fafc" font-size="22">config key is read.</text><text x="125" y="381" fill="#f8fafc" font-size="22">Group by package.</text><text x="125" y="414" fill="#f8fafc" font-size="22">Show unique files only.</text><rect x="125" y="455" width="205" height="34" rx="17" fill="#172554"/><text x="145" y="478" fill="#bfdbfe" font-size="14">agent intent, not a script</text>
<rect x="590" y="180" width="470" height="380" rx="24" fill="#0d1715" stroke="#2dd4bf"/><text x="625" y="225" fill="#5eead4" font-size="17">DETERMINISTIC PIPELINE</text><text x="625" y="280" fill="#d1fae5" font-size="20">rg --json 'configKey' src packages</text><text x="625" y="325" fill="#86efac" font-size="20">| jq -r 'select(.type=="match")</text><text x="625" y="360" fill="#86efac" font-size="20">  | .data.path.text'</text><text x="625" y="405" fill="#fde68a" font-size="20">| sort -u</text><text x="625" y="462" fill="#94a3b8" font-size="16">rg → scope + evidence</text><text x="625" y="492" fill="#94a3b8" font-size="16">jq → structured extraction</text><text x="625" y="522" fill="#94a3b8" font-size="16">sort -u → stable result</text>
<rect x="1160" y="220" width="350" height="300" rx="24" fill="#101821" stroke="#334155"/><text x="1195" y="265" fill="#c4b5fd" font-size="17">RESULT</text><text x="1195" y="315" fill="#f8fafc" font-size="20">packages/api/config.ts</text><text x="1195" y="352" fill="#f8fafc" font-size="20">packages/ui/runtime.ts</text><text x="1195" y="389" fill="#f8fafc" font-size="20">src/bootstrap.ts</text><text x="1195" y="450" fill="#a7f3d0" font-size="16">3 unique files</text></g><path d="M490 370H590" stroke="#60a5fa" stroke-width="4"/><path d="M580 362l12 8-12 8" fill="none" stroke="#60a5fa" stroke-width="4"/><path d="M1060 370H1160" stroke="#a78bfa" stroke-width="4"/><path d="M1150 362l12 8-12 8" fill="none" stroke="#a78bfa" stroke-width="4"/><g font-family="system-ui,sans-serif"><rect x="420" y="635" width="760" height="62" rx="31" fill="#111827" stroke="#334155"/><text x="495" y="674" fill="#94a3b8" font-size="18">non-interactive</text><text x="720" y="674" fill="#64748b" font-size="18">•</text><text x="765" y="674" fill="#94a3b8" font-size="18">composable</text><text x="925" y="674" fill="#64748b" font-size="18">•</text><text x="970" y="674" fill="#94a3b8" font-size="18">reproducible</text></g></svg>